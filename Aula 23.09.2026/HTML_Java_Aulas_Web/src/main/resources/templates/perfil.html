<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head td:fragment="~{cabecalho :: cabecalho}">
	</head>
	<body>
		<form th:action="@{/perfil}" th:object="${perfil}" method="post">
			<h1>Cadastro de Perfil</h1>
			<label for="nome">Digite seu nome:</label><br>			
			<input type="text" name="nome" id="nome" th:field="*{nome}" size="40" maxlength="40" required><br>
			<label for="datanasci">Data de nascimento:</label><br>
			<input type="date" name="datanasci" id="datanasci" th:min="${min}" th:max="${max}" th:field="*{datanasci}" required><br>
			<label for="corfundo">Cor do fundo:</label><br>
			<input type="color" name="corfundo" id="corfundo" th:field="*{corfundo}" required><br>
			<label for="cortexto">Cor do texto:</label><br>
			<input type="color" name="cortexto" id="cortexto" th:field="*{cortexto}" required><br>
			<button type="submit">Cadastro</button>
			<button><a th:href="@{/}">Voltar</a></button> 
		</form>
		<section class="resposta" th:if="${perfil.nome!=null and perfil.nome!=''}" th:style="'background-color:'+${pessoa.corfundo}+;color:'${pessoa.corfundo}">
			<h1>Dados</h1>
			<p>Nome: <span th:text="${pessoa.nome}">nome</span></p>
			<p>Data de Nascimento:<span th:text="${#temporals.format(perfil.datanasci,'dd/MM/yyyy')}">0</span></p>
	</body>
</html>
